<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="a30m">
<meta name="theme-color" content="#0F1011">
<title>a30m</title>
<style>
/* Tokens: docs/design/DESIGN.md, copied from Airth v0. */
:root{--bg:#0F1011;--panel:#17181A;--card:#1D1F22;--raised:#23262A;--chip:#26292D;--line:#2A2D31;--line-soft:#24272B;--text:#ECEDEE;--text-2:#C2C7CE;--text-3:#A3A9B1;--text-4:#8B929B;--text-5:#6F767F;--accent:#8FA6FF;--accent-hover:#B8C6FF;--ok:#5BD08D;--ok-bg:#16301F;--warn:#F5B353;--warn-bg:#2A2213;--warn-chip:#3A2C14;--warn-muted:#D9C29A;--bad:#FF9A9A;--fs-small:11px;--fs-caption:11.5px;--fs-12:12px;--fs-secondary:12.5px;--fs-body:14px;--fs-card:15px;--fs-value:18px;--fs-headline:22px;color-scheme:dark}
:root[data-theme="light"]{--bg:#F4F4F5;--panel:#FFFFFF;--card:#FAFAFA;--raised:#EFEFF1;--chip:#EDEDEF;--line:#E4E4E7;--line-soft:#ECECEE;--text:#09090B;--text-2:#27272A;--text-3:#5F5F66;--text-4:#71717A;--text-5:#8E8E96;--accent:#3B5BDB;--accent-hover:#2F4AB8;--ok:#15803D;--ok-bg:#E3F4E8;--warn:#B45309;--warn-bg:#FEF3E2;--warn-chip:#FDE7C4;--warn-muted:#8A5A1C;--bad:#DC2626;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:var(--fs-body)/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;height:100dvh;display:flex;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-height:40px;cursor:pointer}
button:hover{border-color:var(--text-5)}
button.primary{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600}
button.ghost{background:transparent}
button.danger{color:var(--bad)}
button:disabled{opacity:.45;cursor:default}
input,textarea,select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:40px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--text-5)}
textarea{resize:none;width:100%}
code,pre,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:var(--fs-secondary)}
a{color:var(--accent);text-decoration:none}a:hover{color:var(--accent-hover)}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Workspaces bar, as in Discord: one tile per workspace. */
#spaces{width:72px;flex:none;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0;overflow-y:auto}
#spaces .sep{width:32px;height:2px;border-radius:2px;background:var(--line);margin:2px 0}
.tile{position:relative;width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-weight:700;font-size:16px;cursor:pointer;border:none;padding:0;min-height:0;transition:border-radius .15s}
.tile:hover,.tile.on{border-radius:12px}
.tile::before{content:"";position:absolute;left:-12px;width:4px;height:0;border-radius:0 4px 4px 0;background:var(--text);transition:height .15s}
.tile:hover::before{height:20px}.tile.on::before{height:36px}
.tile .badge{position:absolute;right:-3px;bottom:-3px;width:14px;height:14px;border-radius:50%;border:3px solid var(--bg)}
.tile .badge.wait{background:var(--warn)}.tile .badge.run{background:var(--ok)}
.tile.home{background:var(--raised);color:var(--text)}
.tile.add{background:var(--card);color:var(--ok);border:1px dashed var(--line)}
#spaces .grow{flex:1}

/* The workspace's menu, next to the bar. */
#menu{width:232px;flex:none;display:flex;flex-direction:column;padding:16px 10px 12px 4px;gap:2px}
#menu .ws-name{font-size:var(--fs-card);font-weight:600;padding:6px 12px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#menu .ws-sub{font-size:var(--fs-12);color:var(--text-4);padding:0 12px 12px}
.label{font-size:var(--fs-caption);font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--text-3);margin:14px 12px 6px}
.nav{display:flex;align-items:center;gap:10px;padding:0 12px;min-height:40px;border-radius:10px;cursor:pointer;color:var(--text-3);border:none;background:none;width:100%;text-align:left}
.nav:hover{background:var(--raised);color:var(--text-2)}
.nav.on{background:var(--raised);color:var(--text)}
.nav .count{margin-left:auto;background:var(--warn-chip);color:var(--warn);font-size:var(--fs-small);font-weight:700;border-radius:999px;padding:1px 7px}
.nav .soon{margin-left:auto;font-size:var(--fs-small);color:var(--text-5)}
#menu .grow{flex:1}

/* Main panel. */
#main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--panel);margin:12px 12px 12px 0;border-radius:16px;border:1px solid var(--line-soft);overflow:hidden}
.page-head{display:flex;align-items:flex-end;gap:12px;padding:24px 32px 14px;border-bottom:1px solid var(--line-soft)}
.page-head .lbl{font-size:var(--fs-caption);font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--text-3)}
.page-head h1{margin:2px 0 0;font-size:var(--fs-headline);font-weight:600;letter-spacing:-.015em;line-height:1.2}
.page-head .sum{color:var(--text-4);font-size:var(--fs-secondary);margin-top:4px;min-height:1em}
.page-head .grow{flex:1}
.page-head .actions{display:flex;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-12);color:var(--text-3)}
.pill .d{width:7px;height:7px;border-radius:50%;background:var(--text-5)}
.pill.wait{color:var(--warn)}.pill.wait .d{background:var(--warn)}
.pill.run{color:var(--ok)}.pill.run .d{background:var(--ok)}
.scroll{flex:1;overflow-y:auto;padding:8px 32px 20px}
.col{max-width:880px;margin:0 auto}

/* Chat. */
.msg{margin:16px 0;color:var(--text-2);word-wrap:break-word}
.msg p{margin:0 0 10px}.msg p:last-child{margin-bottom:0}
.msg ul,.msg ol{margin:0 0 10px;padding-left:22px}.msg li{margin:3px 0}
.msg h3{font-size:var(--fs-card);margin:14px 0 6px;color:var(--text)}
.msg code{background:var(--chip);border-radius:6px;padding:1px 5px}
.msg pre{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow:auto;white-space:pre-wrap}
.msg b{color:var(--text);font-weight:600}
.msg.user{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;color:var(--text);margin-left:auto;max-width:78%;width:fit-content;white-space:pre-wrap}
.who{display:flex;align-items:center;gap:8px;font-size:var(--fs-secondary);color:var(--text-3);font-weight:600;margin:18px 0 -8px}
.av{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:#4FCB8F;color:#08261A}
.av svg.i{width:14px;height:14px;stroke-width:2.2}
.tool{margin:4px 0;color:var(--text-4);font-size:var(--fs-secondary)}
.tool summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;padding:3px 0}
.tool summary::-webkit-details-marker{display:none}
.tool summary svg.i{width:15px;height:15px}
.tool summary .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tool pre{white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;max-height:280px;overflow:auto;color:var(--text-3)}
.tool.err summary{color:var(--bad)}
.tool.run summary .t::after{content:" …"}
.working{display:flex;align-items:center;gap:8px;color:var(--text-4);font-size:var(--fs-secondary);margin:12px 0}
.working .d{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:p 1.2s infinite}
@keyframes p{50%{opacity:.3}}
.error{color:var(--bad);margin:10px 0;font-size:var(--fs-secondary)}
.composer{padding:12px 32px 20px}
.composer .col{display:flex;gap:8px;align-items:flex-end;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 6px 6px 4px}
.composer textarea{border:none;background:transparent;min-height:40px;max-height:200px}
.empty{color:var(--text-4);text-align:center;margin:16vh auto 0;max-width:420px}
.empty h2{color:var(--text);font-size:var(--fs-value);font-weight:600;margin:0 0 6px}

/* Approval card. */
.ask{border:1px solid var(--warn);background:var(--warn-bg);border-radius:16px;padding:14px 16px;margin:14px 0}
.ask .tag{display:flex;gap:8px;align-items:center;font-size:var(--fs-caption);font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--warn)}
.ask .what{color:var(--text);font-size:var(--fs-card);margin:8px 0 2px;word-break:break-word}
.ask .does{color:var(--warn-muted);font-size:var(--fs-secondary)}
.ask details{margin:8px 0 10px;font-size:var(--fs-secondary);color:var(--text-4)}
.ask details summary{cursor:pointer}
.ask pre{white-space:pre-wrap;margin:6px 0 0;max-height:220px;overflow:auto;color:var(--text-3)}
.ask .row{display:flex;gap:8px;align-items:center}
.ask .row input{flex:1;min-width:0;background:var(--panel)}

/* Reading pages. */
.section{margin:22px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.card + .card{margin-top:12px}
.card h3{margin:0 0 4px;font-size:var(--fs-card);font-weight:600}
.card .sub{color:var(--text-4);font-size:var(--fs-secondary);margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.row input,.row select{flex:1;min-width:180px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:8px;padding:3px 9px;margin:3px 6px 3px 0;font-size:var(--fs-secondary);color:var(--text-2)}
.chip .d{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.chip .d.off{background:var(--text-5)}
.muted{color:var(--text-4);font-size:var(--fs-secondary)}
.note{margin-top:10px;font-size:var(--fs-secondary);color:var(--text-4)}
.note.bad{color:var(--bad)}.note.ok{color:var(--ok)}
.soon-page{margin:14vh auto 0;max-width:460px;text-align:center}
.soon-page .ic{width:52px;height:52px;border-radius:16px;background:var(--raised);display:grid;place-items:center;margin:0 auto 14px;color:var(--text-3)}
.soon-page .ic svg.i{width:24px;height:24px}
.soon-page .tag{display:inline-block;background:var(--chip);color:var(--text-3);border-radius:999px;padding:3px 10px;font-size:var(--fs-caption);font-weight:600;margin-bottom:10px}
.soon-page h2{margin:0 0 6px;font-size:var(--fs-value)}
.soon-page p{color:var(--text-4);margin:0}

/* Dialog. */
#veil{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;place-items:center;z-index:10;padding:16px}
#veil.open{display:grid}
#veil .box{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;width:100%;max-width:420px}
#veil h2{margin:0 0 6px;font-size:var(--fs-value)}
#veil p{margin:0 0 14px;color:var(--text-4);font-size:var(--fs-secondary)}
#veil input{width:100%}
#veil .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}

@media (max-width:720px){
body{flex-direction:column;font-size:15px}
input,textarea,select{font-size:16px}
#spaces{width:auto;flex-direction:row;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));overflow-x:auto;overflow-y:hidden}
#spaces .sep{width:2px;height:32px}
#spaces .grow,#spaces .theme{display:none}
.tile{width:42px;height:42px;flex:none}
.tile::before{display:none}
.tile.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--text)}
#menu{width:auto;flex-direction:row;padding:0 8px 6px;gap:4px;overflow-x:auto}
#menu .ws-name,#menu .ws-sub,#menu .label,#menu .grow{display:none}
.nav{width:auto;flex:none;padding:0 12px}
.nav .soon{display:none}
#main{margin:0;border-radius:0;border:none;border-top:1px solid var(--line-soft)}
.page-head{padding:14px 16px 10px}
.page-head h1{font-size:20px}
.page-head .lbl{display:none}
.scroll{padding:4px 16px 12px}
.composer{padding:8px 12px;padding-bottom:max(12px,env(safe-area-inset-bottom))}
.msg.user{max-width:88%}
.ask .row{flex-wrap:wrap}.ask .row input{flex-basis:100%;order:3}
.hide-sm{display:none}
}
</style>
</head>
<body>
<nav id="spaces" aria-label="Workspaces"></nav>
<nav id="menu" aria-label="Workspace menu"></nav>
<main id="main"></main>
<div id="veil"><div class="box" role="dialog" aria-modal="true" id="dlg"></div></div>
<script>
const params = new URLSearchParams(location.hash.slice(1));
if (params.get('t')) { sessionStorage.setItem('a30m-token', params.get('t')); history.replaceState(null, '', location.pathname); }
const token = sessionStorage.getItem('a30m-token') || '';
let current = localStorage.getItem('a30m-ws') || '';
let page = localStorage.getItem('a30m-page') || 'chat';
let list = [], state = null, info = null, sent = false, note = null, agentNote = null;

// Theme: the system's until the owner picks one.
const savedTheme = localStorage.getItem('a30m-theme');
if (savedTheme) document.documentElement.dataset.theme = savedTheme;
else if (matchMedia('(prefers-color-scheme: light)').matches) document.documentElement.dataset.theme = 'light';

async function api(path, body) {
  const opts = {headers: {'X-A30m-Token': token}};
  if (body !== undefined) { opts.method = 'POST'; opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const r = await fetch('/api/' + path, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Icons, drawn after Lucide's.
const P = {
  chat: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  needs: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  team: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  routines: '<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',
  files: '<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
  agent: '<path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/>',
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>',
  moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
  spark: '<path d="M12 3l1.9 5.8L20 10.7l-5.4 3.5L15.8 21 12 17l-3.8 4 1.2-6.8L4 10.7l6.1-1.9z"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  globe: '<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>',
  file: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/>',
  pen: '<path d="M12 20h9"/><path d="M16.4 3.6a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  book: '<path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>',
  plug: '<path d="M12 22v-5"/><path d="M9 8V2"/><path d="M15 8V2"/><path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"/>',
  newc: '<path d="M12 7v6"/><path d="M9 10h6"/><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
};
const icon = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${P[n] || ''}</svg>`;

// A workspace's colour, from the agents' family (never a status colour).
const COLOURS = [['#4C8DFF','#0B1A33'],['#F39C4A','#2A1404'],['#8B6CF6','#170D33'],['#4FCB8F','#08261A'],['#E07AB0','#2E0B1E'],['#3FBFD0','#06262B']];
const colour = slug => { let h = 2166136261; for (const c of slug) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; } return COLOURS[h % COLOURS.length]; };
const initials = name => name.split(/\s+/).filter(Boolean).slice(0, 2).map(w => [...w][0]).join('').toUpperCase() || '?';

// Markdown, small and safe: the text is escaped first; links are http(s) only.
function md(src) {
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  const out = []; let list = null, para = [], code = null;
  const flush = () => { if (para.length) { out.push('<p>' + para.map(inline).join('<br>') + '</p>'); para = []; } if (list) { out.push(`<${list.t}>` + list.items.map(i => '<li>' + inline(i) + '</li>').join('') + `</${list.t}>`); list = null; } };
  for (const line of String(src).split('\n')) {
    if (code !== null) { if (line.startsWith('```')) { out.push('<pre>' + esc(code.join('\n')) + '</pre>'); code = null; } else code.push(line); continue; }
    if (line.startsWith('```')) { flush(); code = []; continue; }
    const h = line.match(/^#{1,4}\s+(.*)/);
    const ul = line.match(/^\s*[-*•]\s+(.*)/);
    const ol = line.match(/^\s*\d+[.)]\s+(.*)/);
    if (h) { flush(); out.push('<h3>' + inline(h[1]) + '</h3>'); }
    else if (ul || ol) { if (para.length) flush(); const t = ul ? 'ul' : 'ol'; if (list && list.t !== t) flush(); if (!list) list = {t, items: []}; list.items.push((ul || ol)[1]); }
    else if (!line.trim()) flush();
    else { if (list) flush(); para.push(line); }
  }
  if (code !== null) out.push('<pre>' + esc(code.join('\n')) + '</pre>');
  flush();
  return out.join('');
}

// A tool call, said in plain words.
function says(name, input) {
  const i = input || {};
  const host = u => { try { const x = new URL(u); return x.host + (x.pathname === '/' ? '' : x.pathname); } catch { return u; } };
  switch (name) {
    case 'list_files': return ['files', i.path ? `Looked in ${i.path}` : "Looked in the workspace's folder"];
    case 'read_file': return ['file', `Read ${i.path}`];
    case 'write_file': return ['pen', `Wrote ${i.path}`];
    case 'read_skill': return ['book', `Read the skill ${i.name}`];
    case 'web_search': return ['search', `Searched the web for “${i.query}”`];
    case 'web_fetch': return ['globe', `Read ${host(i.url)}`];
  }
  const m = name.match(/^mcp__(.+?)__(.+)$/);
  if (m) return ['plug', `${m[1]} · ${m[2].replace(/_/g, ' ')}`];
  return ['plug', name];
}
function renderSpaces() {
  const theme = document.documentElement.dataset.theme === 'light' ? 'moon' : 'sun';
  $('spaces').innerHTML =
    `<button class="tile home" title="a30m">${icon('spark')}</button><div class="sep"></div>` +
    list.map(w => { const [bg, fg] = colour(w.slug); return `<button class="tile ${w.slug === current ? 'on' : ''}" data-slug="${esc(w.slug)}" title="${esc(w.name)}" style="background:${bg};color:${fg}">${esc(initials(w.name))}${w.waiting ? '<span class="badge wait" title="Needs you"></span>' : w.running ? '<span class="badge run" title="Working"></span>' : ''}</button>`; }).join('') +
    `<button class="tile add" id="addWs" title="New workspace">${icon('plus')}</button><span class="grow"></span>` +
    `<button class="tile home theme" id="theme" title="Light or dark">${icon(theme)}</button>`;
  document.querySelectorAll('.tile[data-slug]').forEach(el => el.onclick = () => { if (el.dataset.slug === current) return; current = el.dataset.slug; localStorage.setItem('a30m-ws', current); state = null; note = null; agentNote = null; refresh(); });
  $('addWs').onclick = newWorkspace;
  $('theme').onclick = () => { const light = document.documentElement.dataset.theme !== 'light'; document.documentElement.dataset.theme = light ? 'light' : 'dark'; localStorage.setItem('a30m-theme', light ? 'light' : 'dark'); renderSpaces(); };
}

const PAGES = [
  ['chat', 'Chat', 'chat'], ['needs', 'Needs you', 'needs'],
  ['team', 'Team', 'team', true], ['routines', 'Routines', 'routines', true], ['files', 'Files', 'files', true],
  ['agent', 'Agent', 'agent'],
];
function renderMenu() {
  const ws = list.find(w => w.slug === current);
  if (!ws) { $('menu').innerHTML = ''; return; }
  const waiting = state ? state.waiting.length : 0;
  const status = state && state.waiting.length ? 'Waiting for you' : state && state.running ? 'Working' : 'Idle';
  const item = ([id, label, ic, soon]) => `<button class="nav ${page === id ? 'on' : ''}" data-page="${id}">${icon(ic)}<span>${label}</span>${id === 'needs' && waiting ? `<span class="count">${waiting}</span>` : ''}${soon ? '<span class="soon">Soon</span>' : ''}</button>`;
  $('menu').innerHTML = `<div class="ws-name">${esc(ws.name)}</div><div class="ws-sub">${status}${state ? ' · ' + esc(shortModel(state.model)) : ''}</div>` +
    PAGES.slice(0, 2).map(item).join('') + '<div class="label">Work</div>' + PAGES.slice(2, 5).map(item).join('') +
    '<div class="label">Settings</div>' + PAGES.slice(5).map(item).join('') + '<span class="grow"></span>';
  document.querySelectorAll('.nav').forEach(el => el.onclick = () => { page = el.dataset.page; localStorage.setItem('a30m-page', page); note = null; agentNote = null; draw(true); });
}
const shortModel = m => String(m || '').replace(/^anthropic\//, '');

function head(title, sum, actions) {
  const ws = list.find(w => w.slug === current);
  return `<div class="page-head"><div><div class="lbl">${esc(ws ? ws.name : 'a30m')}</div><h1>${esc(title)}</h1><div class="sum">${sum || ''}</div></div><span class="grow"></span><div class="actions">${actions || ''}</div></div>`;
}

function draw(fresh) {
  renderSpaces(); renderMenu();
  const main = $('main');
  if (!token) { main.innerHTML = `<div class="empty"><h2>Open a30m from the server</h2>Open the address the server printed when it started; it ends with #t=…</div>`; return; }
  if (!current) { main.innerHTML = `<div class="empty"><h2>No workspace yet</h2>A workspace keeps its own agent, files, connections and conversations, apart from the others.<div style="margin-top:16px"><button class="primary" id="firstWs">New workspace</button></div></div>`; $('firstWs').onclick = newWorkspace; return; }
  if (!state) { main.innerHTML = ''; return; }
  if (page === 'chat') return drawChat(fresh);
  if (page === 'needs') return drawNeeds();
  if (page === 'agent') return drawAgent(fresh);
  const p = PAGES.find(x => x[0] === page) || PAGES[0];
  const what = {
    team: 'The agents you hire for this workspace, in groups, with a lead who hands out the work. You will talk to the lead or to any agent directly.',
    routines: 'Recurring work given to an agent: a schedule or an event, an instruction in plain words, and what it may do alone. Created by talking, from an agent\'s suggestion, or here.',
    files: 'The files your agents write in this workspace, to read, download and restore.',
  }[page] || '';
  main.innerHTML = head(p[1], '') + `<div class="scroll"><div class="soon-page"><div class="ic">${icon(p[2])}</div><span class="tag">In development</span><h2>${p[1]}</h2><p>${what}</p></div></div>`;
}

function statusPill() {
  if (!state) return '';
  if (state.waiting.length) return '<span class="pill wait"><span class="d"></span>Waiting for you</span>';
  if (state.running) return '<span class="pill run"><span class="d"></span>Working</span>';
  return '';
}

function askCard(a) {
  const [ic, text] = says(a.tool, a.input);
  const does = a.tool === 'web_fetch' ? 'Approving lets the agent read this page once. Its address leaves the server.' : 'Approving runs it once, as shown.';
  return `<div class="ask"><div class="tag">${icon('needs')} Needs you · ${esc(a.class)}</div>
    <div class="what">The agent wants to: ${esc(text.charAt(0).toLowerCase() + text.slice(1))}</div><div class="does">${does}</div>
    <details><summary>Details</summary><pre class="mono">${esc(a.tool)}\n${esc(JSON.stringify(a.input, null, 2))}</pre></details>
    <div class="row"><button class="primary" data-ok="${a.id}">Approve</button><input data-why="${a.id}" placeholder="Why not? (optional)"><button class="danger" data-no="${a.id}">Refuse</button></div></div>`;
}
// Polling redraws the cards; what the owner was typing in them is kept.
function keepTyping(redraw) {
  const typed = {}; let focus = null;
  document.querySelectorAll('[data-why]').forEach(i => { typed[i.dataset.why] = i.value; if (i === document.activeElement) focus = i.dataset.why; });
  redraw();
  document.querySelectorAll('[data-why]').forEach(i => { if (typed[i.dataset.why]) i.value = typed[i.dataset.why]; if (i.dataset.why === focus) i.focus(); });
}
function bindAsks() {
  document.querySelectorAll('[data-ok]').forEach(b => b.onclick = () => answer(b.dataset.ok, true));
  document.querySelectorAll('[data-no]').forEach(b => b.onclick = () => answer(b.dataset.no, false, document.querySelector(`[data-why="${b.dataset.no}"]`).value));
}
async function answer(id, approve, reason) {
  try { await api('approvals/' + id, {approve, reason: reason || ''}); refresh(); } catch (e) { note = e.message; draw(); }
}

function drawChat(fresh) {
  const s = state;
  if (fresh || !$('feed')) {
    $('main').innerHTML = head('Chat', '', `<button class="ghost" id="newConv" title="Start a new conversation; this one is kept">${icon('newc')}<span class="hide-sm"> New conversation</span></button>`) +
      `<div class="scroll" id="feed"><div class="col" id="wrap"></div></div>
      <form class="composer" id="composer"><div class="col"><textarea id="text" rows="1" placeholder="Ask a30m…"></textarea><button class="primary" id="send">Send</button></div></form>`;
    $('newConv').onclick = () => confirmBox('Start a new conversation?', 'This one is kept on the server, but the agent will no longer see it.', 'New conversation', async () => { await api(`workspaces/${current}/conversation/new`, {}); refresh(); });
    $('composer').onsubmit = async e => {
      e.preventDefault();
      const t = $('text'); const text = t.value.trim(); if (!text) return;
      try { await api(`workspaces/${current}/messages`, {text}); t.value = ''; grow(t); sent = true; refresh(); } catch (err) { note = err.message; draw(); }
    };
    $('text').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('composer').requestSubmit(); } };
    $('text').oninput = e => grow(e.target);
    sent = true;
  }
  document.querySelector('.page-head .sum').innerHTML = statusPill();
  $('send').disabled = s.running; $('newConv').disabled = s.running || !s.messages.length;
  const results = {};
  s.messages.forEach(m => m.content.forEach(b => { if (b.type === 'tool_result') results[b.tool_use_id] = b; }));
  let html = '', lastRole = 'user';
  if (!s.messages.length) html = '<div class="empty"><h2>What should a30m do here?</h2>Ask in plain words. Anything that sends, pays, publishes or reaches outside waits for you.</div>';
  for (const m of s.messages) {
    for (const b of m.content) {
      if (m.role === 'assistant' && lastRole !== 'assistant' && (b.type === 'tool_use' || (b.type === 'text' && b.text.trim()))) { html += `<div class="who"><span class="av">${icon('spark')}</span>a30m</div>`; lastRole = 'assistant'; }
      if (m.role === 'user' && b.type === 'text') lastRole = 'user';
      if (b.type === 'text' && b.text.trim()) html += m.role === 'user' ? `<div class="msg user">${esc(b.text)}</div>` : `<div class="msg">${md(b.text)}</div>`;
      if (b.type === 'tool_use') {
        const r = results[b.id]; const [ic, text] = says(b.name, b.input);
        html += `<details class="tool ${r ? (r.is_error ? 'err' : '') : 'run'}"><summary>${icon(ic)}<span class="t">${esc(text)}${r && r.is_error ? ' · failed' : ''}</span></summary><pre>${esc(JSON.stringify(b.input, null, 2))}</pre>${r ? `<pre>${esc(r.content)}</pre>` : ''}</details>`;
      }
    }
  }
  for (const a of s.waiting) html += askCard(a);
  if (s.running && !s.waiting.length) html += '<div class="working"><span class="d"></span>Working…</div>';
  if (s.error) html += `<div class="error">${esc(s.error)}</div>`;
  if (note) html += `<div class="error">${esc(note)}</div>`;
  const feed = $('feed');
  const atBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 80;
  const open = [...document.querySelectorAll('#wrap details')].map((d, n) => d.open ? n : -1).filter(n => n >= 0);
  keepTyping(() => { $('wrap').innerHTML = html; });
  const details = document.querySelectorAll('#wrap details');
  open.forEach(n => { if (details[n]) details[n].open = true; });
  if (atBottom || sent) { feed.scrollTop = feed.scrollHeight; sent = false; }
  bindAsks();
}
const grow = t => { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 200) + 'px'; };

function drawNeeds() {
  const w = state.waiting;
  keepTyping(() => $('main').innerHTML = head('Needs you', w.length ? `${w.length} waiting` : '') +
    `<div class="scroll"><div class="col">${w.length ? w.map(askCard).join('') : '<div class="empty"><h2>Nothing waits for you</h2>When an agent wants to send, pay, publish or reach outside, it asks here first.</div>'}${note ? `<div class="error">${esc(note)}</div>` : ''}</div></div>`);
  bindAsks();
}

function drawAgent(fresh) {
  const s = state;
  if (!fresh && $('agentPage')) return;
  const ready = info ? info.providers.filter(p => p.ready).map(p => p.name) : [];
  const skills = s.skills.length ? s.skills.map(k => `<span class="chip" title="${esc(k.description)}">${esc(k.name)}</span>`).join('') : '<span class="muted">None yet. Import an Agent Plugin or a skill below.</span>';
  const run = s.mcp.running.map(m => `<span class="chip"><span class="d"></span>${esc(m.name)} · ${m.tools} tools</span>`).join('');
  const decl = s.mcp.declared.filter(n => !s.mcp.running.some(m => m.name === n)).map(n => `<span class="chip"><span class="d off"></span>${esc(n)} · starts with the next message</span>`).join('');
  const errs = s.mcp.errors.map(e => `<div class="note bad">${esc(e)}</div>`).join('');
  const classes = Object.entries(s.workspace.tool_classes || {}).map(([t, c]) => `<span class="chip"><span class="mono">${esc(t)}</span> · ${esc(c)}</span>`).join('') || '<span class="muted">Every tool keeps its own class.</span>';
  $('main').innerHTML = head('Agent', 'How this workspace\'s agent works: its model, its skills and the services it may use.') + `<div class="scroll" id="agentPage"><div class="col">
    <div class="section"><div class="card"><h3>Model</h3><div class="sub">${esc(s.model)}${s.workspace.model ? '' : ' · the server\'s default'}. Keys set on the server: ${esc(ready.join(', ') || 'none')}.</div>
      <div class="row"><input id="modelSpec" list="modelHints" placeholder="provider/model, e.g. openai/gpt-6.1-sol"><datalist id="modelHints"><option value="anthropic/claude-sonnet-5-5"><option value="anthropic/claude-opus-5-5"><option value="openai/gpt-6.1-sol"><option value="xai/grok-4.7"><option value="gemini/gemini-pro-latest"><option value="gemini/gemini-flash-latest"><option value="ollama/llama3.3"><option value="echo"><option value="default"></datalist><button id="modelBtn">Use</button></div></div></div>
    <div class="section"><div class="card"><h3>Skills</h3><div class="sub">What the agent knows how to do. It reads a skill before using it.</div>${skills}</div>
      <div class="card"><h3>Connections</h3><div class="sub">MCP servers the agent may use.</div>${(run + decl) || '<span class="muted">None yet.</span>'}${errs}</div>
      <div class="card"><h3>Import</h3><div class="sub">An Agent Plugin or a skill folder, on the server's machine. Its skills and MCP servers are added to this workspace.</div><div class="row"><input id="importPath" placeholder="/path/to/plugin"><button id="importBtn">Import</button></div></div></div>
    <div class="section"><div class="card"><h3>What waits for you</h3><div class="sub">Reads run alone; anything that commits waits for you. Change a tool's class for this workspace only.</div>${classes}
      <div class="row"><input id="clsTool" placeholder="Tool name, e.g. web_fetch"><select id="clsVal"><option value="read">read: runs alone</option><option value="reversible">reversible: runs alone</option><option value="commits">commits: waits for you</option><option value="default">back to its default</option></select><button id="clsBtn">Save</button></div></div></div>
    <div class="note ${agentNote && agentNote.bad ? 'bad' : 'ok'}" id="agentNote">${agentNote ? esc(agentNote.text) : ''}</div>
    <p class="muted">The agent's instructions are in this workspace's <span class="mono">agent/AGENTS.md</span>, on the server. Agents cannot change them.</p>
  </div></div>`;
  const say = (text, bad) => { agentNote = {text, bad}; $('agentNote').textContent = text; $('agentNote').className = 'note ' + (bad ? 'bad' : 'ok'); };
  $('modelBtn').onclick = async () => { try { const r = await api(`workspaces/${current}/model`, {model: $('modelSpec').value.trim()}); say('This workspace now uses ' + r.model + '.'); await refresh(); } catch (e) { say(e.message, true); } };
  $('importBtn').onclick = async () => { const path = $('importPath').value.trim(); if (!path) return; try { const r = await api(`workspaces/${current}/import`, {path}); say('Imported: ' + r.imported.join(', ') + '. Servers start with the next message.'); await refresh(); } catch (e) { say(e.message, true); } };
  $('clsBtn').onclick = async () => { const tool = $('clsTool').value.trim(); if (!tool) return; try { await api(`workspaces/${current}/classes`, {tool, class: $('clsVal').value}); say('Saved.'); await refresh(); } catch (e) { say(e.message, true); } };
}

function dialog(html, focus) {
  $('dlg').innerHTML = html; $('veil').classList.add('open');
  if (focus) setTimeout(() => $(focus) && $(focus).focus(), 30);
}
const closeDialog = () => $('veil').classList.remove('open');
$('veil').onclick = e => { if (e.target.id === 'veil') closeDialog(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDialog(); });
function confirmBox(title, text, ok, run) {
  dialog(`<h2>${esc(title)}</h2><p>${esc(text)}</p><div class="acts"><button class="ghost" id="dNo">Cancel</button><button class="primary" id="dOk">${esc(ok)}</button></div>`, 'dOk');
  $('dNo').onclick = closeDialog;
  $('dOk').onclick = async () => { try { await run(); closeDialog(); } catch (e) { $('dlg').querySelector('p').textContent = e.message; } };
}
function newWorkspace() {
  dialog(`<form id="wsForm"><h2>New workspace</h2><p>A workspace keeps its own agent, files, connections and conversations, apart from the others.</p><input id="wsName" placeholder="Name, e.g. Personal or Acme Ltd" autocomplete="off"><div class="acts"><button type="button" class="ghost" id="dNo">Cancel</button><button class="primary">Create</button></div></form>`, 'wsName');
  $('dNo').onclick = closeDialog;
  $('wsForm').onsubmit = async e => {
    e.preventDefault(); const name = $('wsName').value.trim(); if (!name) return;
    try { const r = await api('workspaces', {name}); current = r.slug; localStorage.setItem('a30m-ws', current); page = 'chat'; localStorage.setItem('a30m-page', page); state = null; closeDialog(); refresh(); }
    catch (err) { $('dlg').querySelector('p').textContent = err.message; }
  };
}

let timer, last = '', lastContent = '';
async function refresh() {
  clearTimeout(timer);
  try {
    list = (await api('workspaces')).workspaces;
    if (!list.some(w => w.slug === current)) { current = list[0] ? list[0].slug : ''; localStorage.setItem('a30m-ws', current); state = null; }
    if (current) state = await api('workspaces/' + current);
    if (!info) info = await api('info').catch(() => null);
  } catch (e) { $('main').innerHTML = `<div class="empty"><h2>Cannot reach the server</h2>${esc(e.message)}</div>`; }
  const key = page + '|' + current;
  const content = page === 'agent' && state ? JSON.stringify([state.model, state.workspace, state.skills, state.mcp]) : '';
  draw(key !== last || content !== lastContent);
  last = key; lastContent = content;
  timer = setTimeout(refresh, state && (state.running || state.waiting.length) ? 1200 : 4000);
}
if (token) refresh(); else draw();
</script>
</body>
</html>
