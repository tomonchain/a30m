# The one required check. Its job is named `ci`: branch protection requires
# it by that name, and auto-merge waits for it.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks reads the whole history

      - name: Secrets (gitleaks, whole history)
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          # Gitleaks' own default rules, never a config or an ignore file
          # a pull request could bring to silence it.
          rm -f .gitleaks.toml .gitleaksignore
          ./gitleaks git --redact --verbose --exit-code 1 .

      # The Rust steps run once the workspace exists.
      - uses: dtolnay/rust-toolchain@stable
        if: hashFiles('Cargo.toml') != ''
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        if: hashFiles('Cargo.toml') != ''

      - name: Format
        if: hashFiles('Cargo.toml') != ''
        run: cargo fmt --check

      - name: Lints
        if: hashFiles('Cargo.toml') != ''
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        if: hashFiles('Cargo.toml') != ''
        run: cargo test --locked
