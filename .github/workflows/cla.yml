# Asks outside contributors to sign CLA.md before their pull request can merge.
# Signatures are kept in the `cla-signatures` branch, never on main.
#
# Off until the CLA is in force: nobody is asked to sign a draft. Once a
# lawyer has reviewed CLA.md, create the `cla-signatures` branch and set the
# repository variable CLA_IN_FORCE to `true`.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-24.04
    if: >-
      vars.CLA_IN_FORCE == 'true' && (
        github.event_name == 'pull_request_target' ||
        (github.event.issue.pull_request &&
         (github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')))
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/tomonchain/a30m/blob/main/CLA.md
          branch: cla-signatures
          allowlist: tomonchain,dependabot[bot],github-actions[bot]
